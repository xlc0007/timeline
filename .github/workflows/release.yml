name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Sync version from tag
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Install frontend deps
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build app
        run: npm run tauri build

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item "src-tauri/target/release/shiguang-tiaoxian.exe" "时光线条.exe"
          Compress-Archive -Path "时光线条.exe" -DestinationPath "时光线条_${ver}_x64_便携版.zip" -Force

      - name: Create source ZIP
        shell: bash
        run: |
          git archive --format=zip -o "shiguang-tiaoxian-src-${{ github.ref_name }}.zip" HEAD

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            时光线条_*_x64_便携版.zip
            shiguang-tiaoxian-src-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
