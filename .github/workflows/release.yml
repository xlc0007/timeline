name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Sync version from tag
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Install frontend deps
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build app
        run: npm run tauri build

      - name: Rename installers to ASCII names
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $out = "src-tauri/target/release/bundle/out"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          Copy-Item $setup.FullName "$out/ShiguangTimeline_${ver}_x64-setup.exe"
          if ($msi) { Copy-Item $msi.FullName "$out/ShiguangTimeline_${ver}_x64.msi" }
          Get-ChildItem $out | Select-Object Name, Length

      - name: Create installer ZIP
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $setup = "src-tauri/target/release/bundle/out/ShiguangTimeline_${ver}_x64-setup.exe"
          Compress-Archive -Path $setup -DestinationPath "ShiguangTimeline_${ver}_x64_installer.zip" -Force
          Get-Item "ShiguangTimeline_${ver}_x64_installer.zip" | Select-Object Name, Length

      - name: Create source ZIP
        shell: bash
        run: |
          git archive --format=zip -o "shiguang-tiaoxian-src-${{ github.ref_name }}.zip" HEAD

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/out/*.exe
            src-tauri/target/release/bundle/out/*.msi
            ShiguangTimeline_*_x64_installer.zip
            shiguang-tiaoxian-src-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
